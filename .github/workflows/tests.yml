name: brew test-bot

# Bottles are built on PRs only: `brew pr-pull` (publish.yml) pushes the
# bottle commit to main, so a push trigger would rebuild the same formula on
# a macOS runner for nothing.
on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: test-bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 only: aimd is MLX-only and brew mlx is a macOS arm64
        # formula. Linux bottles need the tap's CUDA-enabled mlx formula and a
        # CUDA-capable self-hosted runner (shuuul/aimd specs/002 WS-09).
        os: [ macos-26 ]
        # TODO(WS-09): enable once Formula/aimd.rb supports Linux, e.g.
        # include:
        #   - os: [ self-hosted, linux, x64, cuda ]
        #     container:
        #       image: ghcr.io/homebrew/brew:main
        #       options: --privileged --gpus all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # TODO(WS-09): restore with the Linux matrix entry:
    # container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
