name: brew test-bot

# Bottles are built on PRs only: `brew pr-pull` (publish.yml) pushes the
# bottle commit to main, so a push trigger would rebuild the same formula on
# a macOS runner for nothing.
on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: test-bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 here. Build aimd Linux bottles separately on a host
        # with the NVIDIA stack so brew test can load libmlx.so.
        # GPU-free formulae get Linux bottles from the test-bot-linux job.
        os: [ xcode-27 ]  # macOS 27: brew mlx bottles exist only for the newest macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # Linux bottles for the formulae in LINUX_BOTTLES only (no GPU needed).
  # aimd depends on them but cannot build here, so dependents are skipped.
  test-bot-linux:
    strategy:
      fail-fast: false
      matrix:
        # Homebrew's brew doctor rejects ubuntu-22.04's glibc 2.35 as too old.
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LINUX_BOTTLES: firecrawl-local
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Detect changed formulae
        id: detect
        run: brew test-bot --only-formulae-detect

      - name: Keep Linux-bottled formulae
        id: linux
        env:
          TESTING: ${{ steps.detect.outputs.testing_formulae }}
          ADDED: ${{ steps.detect.outputs.added_formulae }}
        run: |
          keep() {
            local out=() name
            IFS=, read -ra names <<< "$1"
            for name in "${names[@]}"; do
              for allowed in $LINUX_BOTTLES; do
                [[ "${name##*/}" == "$allowed" ]] && out+=("$name")
              done
            done
            (IFS=,; echo "${out[*]}")
          }
          echo "testing=$(keep "$TESTING")" >> "$GITHUB_OUTPUT"
          echo "added=$(keep "$ADDED")" >> "$GITHUB_OUTPUT"

      - name: Build bottles
        if: steps.linux.outputs.testing != '' && github.event_name == 'pull_request'
        env:
          TESTING: ${{ steps.linux.outputs.testing }}
          ADDED: ${{ steps.linux.outputs.added }}
        run: |
          brew test-bot --only-formulae --skip-dependents \
            --testing-formulae="$TESTING" --added-formulae="$ADDED"

      - name: Upload bottles as artifact
        if: always() && steps.linux.outputs.testing != '' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
